name: Build Windows executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install vgamepad (without launching its driver installer)
        # vgamepad's setup.py calls `msiexec /i ...ViGEmBusSetup.msi` as a
        # side effect of being built/installed on Windows (any setup.py
        # invocation other than egg_info/sdist triggers it, including
        # `pip download`'s wheel-build step). That blocks forever on a
        # non-interactive CI machine. We fetch the sdist tarball directly
        # from PyPI's file host and copy just the `vgamepad` package into
        # site-packages, never invoking setup.py at all.
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://files.pythonhosted.org/packages/8a/54/0eaddc33f84247963af078f364b37153d09fcd6cdc398f243ec3e8842c56/vgamepad-0.1.0.tar.gz" -OutFile vgamepad.tar.gz
          python -c "
          import tarfile, glob, shutil, sysconfig
          with tarfile.open('vgamepad.tar.gz') as t:
              t.extractall('vg_extract')
          src = glob.glob('vg_extract/vgamepad-*/vgamepad')[0]
          dst = sysconfig.get_paths()['purelib'] + '/vgamepad'
          shutil.copytree(src, dst)
          print('vgamepad package copied to', dst)
          "

      - name: Build with PyInstaller
        run: pyinstaller ps5_launcher.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Launcher-windows
          path: dist/PS5-Launcher/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: PS5-Launcher-windows
          path: PS5-Launcher

      - name: Zip the portable build
        run: cd PS5-Launcher && zip -r ../PS5-Launcher-windows.zip . 

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Astro Launcher build ${{ github.run_number }}
          files: PS5-Launcher-windows.zip
          token: ${{ secrets.GITHUB_TOKEN }}
